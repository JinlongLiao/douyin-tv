plugins {
    id 'com.android.application'
}

android {
    namespace 'com.douyin.tv'
    // 编译 API 37；最低支持和目标行为均以 Android 11 电视（API 30）为基准。
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.douyin.tv"
        minSdk 30
        targetSdk 30
        versionCode 20
        versionName "1.0.19"
        
        // 电视应用标识
        manifestPlaceholders = [isTV: true]
    }

    signingConfigs {
        release {
            storeFile file("../keystore/douyin-tv-release.keystore")
            storePassword "douyintv2024"
            keyAlias "douyintv"
            keyPassword "douyintv2024"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 用户指定 API 30 电视侧载基线；保留 Play 目标版本提示为警告，其余检查保持默认。
        warning 'ExpiredTargetSdkVersion'
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    // 独立随 APK 发布的稳定内核，不使用电视上的系统 WebView。
    implementation 'org.mozilla.geckoview:geckoview:158.0.20261007201254'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Leanback库用于TV应用
    implementation 'androidx.leanback:leanback:1.0.0'
    
    // WebView增强
    implementation 'androidx.webkit:webkit:1.9.0'
    
    // 协程支持
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
}

// Java 与 Kotlin 统一生成 JVM 17 字节码，由 Android 工具链转换为设备可执行的 DEX。
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
